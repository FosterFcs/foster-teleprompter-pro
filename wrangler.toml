# Foster Studio — Teleprompter e gravação · Foster Tech Soluções
#
# Worker de TESTE (sandbox) criado em 09/11 — já tem os segredos
# ASAAS_API_KEY e ASAAS_WEBHOOK_TOKEN cadastrados no painel.
# O endereço público foster-teleprompter-pro.*.workers.dev (V0.2) não é alterado.
name = "frostfoster-teleprompter-api-sandboxy-rice-c068"
main = "src/worker.js"
compatibility_date = "2025-09-01"
keep_vars = true   # não apaga variáveis cadastradas pelo painel ao publicar

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/webhook"]

[[kv_namespaces]]
binding = "PAYMENTS_KV"          # namespace TELEPROMPTER_PRO_PAYMENTS
id = "b0f16785966147f5a30233a9e76fc98a"

[vars]
ASAAS_ENV = "sandbox"          # mude para "production" só depois dos testes
PRICE_MONTHLY = "9.90"         # preços definidos em 09/11 — ajuste se mudar
PRICE_YEARLY = "79.90"
GRACE_DAYS = "3"               # dias de tolerância após o vencimento

# Segredos (NUNCA coloque aqui):
#   npx wrangler secret put ASAAS_API_KEY
#   npx wrangler secret put ASAAS_WEBHOOK_TOKEN

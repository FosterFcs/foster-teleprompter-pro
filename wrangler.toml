# Foster Studio — Teleprompter e gravação · Foster Tech Soluções
#
# Worker oficial do Foster Studio (renomeado em 10/11; antes "frostfoster-teleprompter-api-sandboxy-rice-c068").
# Segredos ASAAS_API_KEY e ASAAS_WEBHOOK_TOKEN ficam cadastrados no painel da Cloudflare.
# Endereço: https://foster-studio.fosterconstrutora.workers.dev
# A V0.2 antiga (foster-teleprompter-pro.*.workers.dev) não é alterada.
name = "foster-studio"
main = "src/worker.js"
compatibility_date = "2025-09-01"
keep_vars = true   # não apaga variáveis cadastradas pelo painel ao publicar

# Domínio próprio (o workers.dev continua ativo: o webhook do Asaas usa ele)
workers_dev = true
routes = [
  { pattern = "studio.engfoster.com.br", custom_domain = true }
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/webhook"]

[[kv_namespaces]]
binding = "PAYMENTS_KV"          # namespace TELEPROMPTER_PRO_PAYMENTS
id = "b0f16785966147f5a30233a9e76fc98a"

# Conferência automática com o Asaas, de hora em hora (minuto 7)
[triggers]
crons = ["7 * * * *"]

# Logs no painel da Cloudflare (aba Observability)
[observability]
enabled = true

[vars]
ASAAS_ENV = "production"       # PRODUÇÃO desde 10/11/2026 (Sandbox testado e aprovado)
PRICE_MONTHLY = "9.90"         # preços definidos em 09/11 — ajuste se mudar
PRICE_YEARLY = "79.90"
GRACE_DAYS = "3"               # dias de tolerância após o vencimento

# Segredos (NUNCA coloque aqui):
#   npx wrangler secret put ASAAS_API_KEY
#   npx wrangler secret put ASAAS_WEBHOOK_TOKEN
